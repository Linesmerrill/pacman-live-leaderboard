<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pac-Man Maze key</title>
  <style>
    /* Self-contained on purpose: the event Mac has no internet, so no CDN components. */
    body { margin: 0; padding: 14px; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: #d8d8d8; background: #2d2d2d; }
    label { display: block; margin-bottom: 12px; }
    span { display: block; margin-bottom: 4px; color: #969696; }
    select, input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 4px; border: 1px solid #3d3d3d; background: #1d1d1d; color: #fff; font: inherit; }
    details { margin-top: 4px; color: #969696; }
    summary { cursor: pointer; }
    p.hint { margin: 6px 0 0; color: #7a7a7a; font-size: 12px; }
  </style>
</head>
<body>
  <label id="command-row">
    <span>Action</span>
    <select id="command"></select>
  </label>

  <p class="hint" id="fixed-note" hidden>This key already knows what it does — just press it.</p>

  <details>
    <summary>Connection</summary>
    <label style="margin-top: 10px">
      <span>Leaderboard address</span>
      <input id="url" type="text" placeholder="http://localhost:3000" spellcheck="false">
    </label>
    <label>
      <span>Staff PIN (only if one is set)</span>
      <input id="pin" type="password" autocomplete="off">
    </label>
    <p class="hint">Leave the address blank when the leaderboard runs on this computer. One key
      is enough: whatever you set here is used by every Pac-Man Maze key on the deck.</p>
  </details>

  <script>
    const COMMANDS = [
      ['ready', 'READY — intro sound, board waiting'],
      ['countdown', '3·2·1 — countdown, then starts the run'],
      ['start', 'START — begin the run and the music'],
      ['power-up', 'POWER UP — power mode for a few seconds'],
      ['ghost-tag', 'GHOST TAG — tagged-by-a-ghost sound'],
      ['fruit', 'FRUIT — bonus sound'],
      ['pac-dot', 'PAC-DOT — single dot blip'],
      ['high-score', 'HIGH SCORE — play the fanfare'],
      ['spotlight', 'SPOTLIGHT — put the last player on the TV for a photo'],
      ['finish', 'FINISH — end the run'],
      ['stop-all', 'STOP ALL — silence everything'],
      ['reset', 'RESET — back to the idle board'],
      ['volume-up', 'VOL + — TV volume up'],
      ['volume-down', 'VOL − — TV volume down'],
      ['mute', 'MUTE — toggle TV sound'],
    ];

    let websocket = null;
    let context = null;
    let settings = {};
    let fixedAction = false;

    const commandEl = document.getElementById('command');
    const urlEl = document.getElementById('url');
    const pinEl = document.getElementById('pin');

    for (const [value, label] of COMMANDS) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      commandEl.append(option);
    }

    function save() {
      settings = { url: urlEl.value.trim(), pin: pinEl.value };
      // Dedicated keys carry their command in the action id; only the spare key stores one.
      if (!fixedAction) settings.command = commandEl.value;
      websocket?.send(JSON.stringify({ event: 'setSettings', context, payload: settings }));
    }

    commandEl.addEventListener('change', save);
    for (const el of [urlEl, pinEl]) el.addEventListener('change', save);

    // Called by the Stream Deck app when the property inspector opens.
    function connectElgatoStreamDeckSocket(port, uuid, registerEvent, _info, actionInfo) {
      context = uuid;
      const info = JSON.parse(actionInfo);
      settings = info.payload.settings ?? {};
      // Every action except the spare "Game Action" has its command baked into its id.
      fixedAction = info.action !== 'com.pacmanmaze.controller.game-key';
      document.getElementById('command-row').hidden = fixedAction;
      document.getElementById('fixed-note').hidden = !fixedAction;
      commandEl.value = settings.command ?? 'ready';
      urlEl.value = settings.url ?? '';
      pinEl.value = settings.pin ?? '';
      websocket = new WebSocket(`ws://127.0.0.1:${port}`);
      websocket.addEventListener('open', () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        if (!fixedAction && !settings.command) save(); // default a fresh spare key to READY
      });
    }
    window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
  </script>
</body>
</html>
